<style><![CDATA[
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
  text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
  .bar-total { font-size: 13px; font-weight: 800; fill: #0f172a; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
  .bar-pct { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; pointer-events: none; }
  .chart-title { font-size: 18px; font-weight: 800; fill: #0f172a; }
  .chart-sub { font-size: 12px; font-weight: 500; fill: #64748b; }
  .callout-box { rx: 5; ry: 5; }
  .callout-text { font-size: 9.5px; font-weight: 800; text-anchor: middle; }
  .axis-title { font-size: 11px; font-weight: 700; fill: #64748b; }
  rect.segment {
    cursor: pointer;
    transition: fill-opacity 0.2s ease, stroke 0.15s ease;
  }
  rect.segment:hover {
    fill-opacity: 0.88;
    stroke: #0f172a !important;
    stroke-width: 2.5px !important;
  }
]]></style>
