<g id="dynamic-tooltip" style="display:none; pointer-events:none; z-index:999;">
  <rect id="tt-bg" rx="6" ry="6" fill="#0f172a" fill-opacity="0.96" stroke="#38bdf8" stroke-width="1" style="filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45));" />
  <text id="tt-title" fill="#ffffff" font-size="11.5" font-weight="800" x="12" y="18" />
  <text id="tt-val" fill="#38bdf8" font-size="10.5" font-weight="700" x="12" y="34" />
  <text id="tt-desc" fill="#94a3b8" font-size="9" font-weight="500" x="12" y="49" />
</g>

<script type="text/javascript"><![CDATA[
  function initTooltips() {
    var svg = document.querySelector('svg');
    var tt = document.getElementById('dynamic-tooltip');
    var ttBg = document.getElementById('tt-bg');
    var ttTitle = document.getElementById('tt-title');
    var ttVal = document.getElementById('tt-val');
    var ttDesc = document.getElementById('tt-desc');
    if (!svg || !tt) return;

    var segments = document.querySelectorAll('.segment');
    segments.forEach(function(el) {
      el.addEventListener('mouseenter', function(e) {
        var t = el.getAttribute('data-t') || '';
        var v = el.getAttribute('data-v') || '';
        var d = el.getAttribute('data-d') || '';
        if (!t) return;
        ttTitle.textContent = t;
        ttVal.textContent = v;
        ttDesc.textContent = d;
        var maxLen = Math.max(t.length, v.length, d.length);
        var w = Math.max(maxLen * 7.5 + 32, 220);
        var h = d ? 66 : 48;
        ttBg.setAttribute('width', w);
        ttBg.setAttribute('height', h);
        tt.style.display = 'block';
      });
      el.addEventListener('mousemove', function(e) {
        var pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        var loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        var x = loc.x + 14;
        var y = loc.y + 14;
        var w = parseFloat(ttBg.getAttribute('width')) || 220;
        var h = parseFloat(ttBg.getAttribute('height')) || 66;
        if (x + w > 1270) x = loc.x - w - 10;
        if (y + h > 610) y = loc.y - h - 10;
        tt.setAttribute('transform', 'translate(' + x + ',' + y + ')');
      });
      el.addEventListener('mouseleave', function() {
        tt.style.display = 'none';
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTooltips);
  } else {
    initTooltips();
  }
]]></script>

</svg>